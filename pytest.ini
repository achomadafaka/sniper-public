[pytest]
testpaths = tests
pythonpath = .
# -n 10: pytest-xdist parallel execution, capped at 10 workers (operator 2026-10-07; never -n auto
#   on this 32-core host; a later -n on the command line still wins).
# -m "not integration": auto-skip integration-marked slow tests on default runs.
# --timeout=60: per-test wall-clock budget via pytest-timeout. Any test that hangs
#   (network, subprocess, lock, deadlock) gets killed and named instead of
#   silently wedging its xdist worker. Codex hit a series of these 2026-05-27.
# --timeout-method=thread: signal-based timeout requires the test to yield to
#   the main thread; thread-based works under xdist subprocesses too.
# To run integration tests: pytest -m integration tests/
# To run serially: pytest -p no:xdist
# To disable timeout per-test: @pytest.mark.timeout(0)
addopts = -n 10 -m "not integration" --timeout=60 --timeout-method=thread
# tmp_path_retention_count=1 + retention_policy=failed: delete tmp_path artifacts
# from successful runs (keep only failed-test scratch). Caps disk growth on the
# basetemp dir over many runs.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    integration: marks tests as integration (deselect with '-m "not integration"')
