# Supabase's REST path: /rest/v1/<path> -> PostgREST /<path>.
server {
    listen 80;
    client_max_body_size 50m;
    # Long `id=in.(...)` filters: the request line, and PostgREST's Content-Location response
    # header that echoes it, both exceed nginx's 4-8 KB defaults (502 "upstream sent too big
    # header" broke brain_nightly's candidate sweep on 2026-10-14).
    large_client_header_buffers 4 64k;

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }

    location = /health {
        return 200 "ok\n";
    }
}
